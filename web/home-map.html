<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151820">
  <title>Home map · Sormus</title>
  <link rel="icon" href="/assets/controls/app-icon.svg">
  <link rel="stylesheet" href="/assets/material-symbols/material-symbols.css">
  <link rel="stylesheet" href="/control-room.css">
  <link rel="stylesheet" href="/home-map.css">
  <script src="/color-themes.js" defer></script>
  <script src="/assets/card-preview.js" defer></script>
  <script src="/card-renderer.js" defer></script>
  <script src="/home-map.js" defer></script>
</head>
<body class="map-viewer">
  <a class="skip" href="#map-viewport">Skip to map</a>
  <header class="map-header">
    <div><p class="map-connection" id="map-connection" role="status">Connecting</p><h1 id="map-name">Home map</h1></div>
    <nav aria-label="Map controls"><a class="map-link" href="/control-room">Controls</a><button class="round-button" id="map-zoom-out" aria-label="Zoom out"><i class="material-symbol ms-minus" aria-hidden="true"></i></button><button class="map-fit" id="map-fit">Fit</button><button class="round-button" id="map-zoom-in" aria-label="Zoom in"><i class="material-symbol ms-plus" aria-hidden="true"></i></button></nav>
  </header>
  <main id="map-viewport" tabindex="-1" aria-label="Home map; scroll to pan when zoomed">
    <div class="map-frame" id="map-frame"><div class="home-map-stage" id="map-stage"><p class="map-empty" id="map-empty">Loading your map…</p></div></div>
  </main>
  <p class="map-notice" id="map-notice" role="status" hidden></p>
  <dialog id="map-detail" aria-labelledby="map-detail-title"><header><div><p id="map-detail-caption"></p><h2 id="map-detail-title"></h2></div><button class="round-button" id="map-detail-close" aria-label="Close"><i class="material-symbol ms-xmark" aria-hidden="true"></i></button></header><div id="map-detail-content"></div></dialog>
  <aside class="receipt" id="map-receipt" role="status" aria-live="polite" hidden><div><strong id="map-receipt-title"></strong><p id="map-receipt-message"></p></div><button class="round-button" id="map-dismiss" aria-label="Dismiss result" hidden><i class="material-symbol ms-xmark" aria-hidden="true"></i></button></aside>
  <noscript>Enable JavaScript to use the home map.</noscript>
</body>
</html>
