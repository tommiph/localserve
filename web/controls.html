<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Control app metadata -->
  <title>Controls · Localserve</title>
  <link rel="icon" href="/assets/controls/app-icon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/controls/app-icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/controls/app-icon-192.png">
  <link rel="stylesheet" href="/assets/material-symbols/material-symbols.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/assets/controls/lighting.css">
  <link rel="stylesheet" href="/assets/controls/television.css">
  <link rel="stylesheet" href="/assets/controls/app.css">
  <script src="/control-app.js" defer></script>
  <script src="/browser-compat.js" defer></script><script src="/controls-renderer.js" defer></script><script src="/lighting-controls.js" defer></script><script src="/television-controls.js" defer></script><script src="/controls-viewer.js" defer></script>
</head>
<body class="controls-viewer">
  <header class="controls-viewer-header"><a href="/controls" class="brand"><img id="controls-logo" src="/assets/logo-dark.svg" width="48" height="30" alt=""><span id="controls-server-name">Localserve</span></a><div><h1 id="controls-title">Controls</h1><span id="controls-status" role="status">Connecting</span></div><button type="button" class="button control-install" id="control-install" hidden><i class="material-symbol ms-download" aria-hidden="true"></i> Install app</button></header>
  <main id="controls-board" aria-label="Controls"></main>
  <footer class="controls-feedback"><p id="controls-feedback" role="status" aria-live="polite"></p><button type="button" class="button" id="controls-cancel" hidden>Cancel remaining steps</button></footer>
  <dialog id="lighting-editor" aria-labelledby="lighting-editor-title"></dialog>
  <dialog id="lighting-confirm" class="lighting-confirm" aria-labelledby="lighting-confirm-title"></dialog>
</body>
</html>
