<!doctype html>
<html lang="en" data-theme="dark" class="admin-page">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Sormus · Administration</title>
    <link rel="icon" href="assets/controls/app-icon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/controls/app-icon-192.png" type="image/png" sizes="192x192">
    <!-- All styles and glyphs are served from this project. -->
    <link rel="stylesheet" href="assets/material-symbols/material-symbols.css">
    <link rel="stylesheet" href="styles.css">
    <!-- The server supplies Tasks, settings, activity, and declared capabilities. -->
    <script src="browser-compat.js" defer></script>
    <script src="color-themes.js" defer></script>
    <script src="color-themes-ui.js" defer></script>
    <script src="time-ui.js" defer></script>
    <script src="admin-ux.js" defer></script>
    <script src="activity-ui.js" defer></script>
    <script src="run-ui.js" defer></script>
    <script src="tasks-ui.js" defer></script>
    <script src="cloud-relay-ui.js" defer></script>
    <script src="plugin-ui.js" defer></script>
    <script src="home-modes-ui.js" defer></script>
      <script src="tv-calendar-ui.js" defer></script>
      <script src="interests-ui.js" defer></script>
    <script src="watch-guide-ui.js" defer></script>
    <script src="assets/card-preview.js?v=4" defer></script>
    <script src="card-renderer.js" defer></script>
    <script src="card-designer.js" defer></script>
    <script src="today-renderer.js" defer></script>
    <script src="vista-renderer.js" defer></script>
    <script src="vistas-ui.js" defer></script>
    <script src="universe-ui.js?v=2" defer></script>
    <script src="games-ui.js" defer></script>
    <script src="assets/lighting-ui.js" defer></script>
    <script src="vr-library-ui.js" defer></script>
    <script src="controls-renderer.js" defer></script>
    <script src="controls-ui.js" defer></script>
    <script src="home-map-ui.js" defer></script>
    <script src="lighting-scenes-ui.js" defer></script>
    <script src="lighting-room-ui.js" defer></script>
    <script src="downloads-ui.js" defer></script>
    <script src="devices-ui.js" defer></script>
    <script src="assets/qrcode/qrcodegen.js" defer></script>
    <script src="phone-home-ui.js" defer></script>
    <script src="variables-ui.js" defer></script>
    <script src="demo-ui.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to content</a>
    <div class="app-shell">
      <button class="navigation-scrim" type="button" data-action="navigation-close" aria-label="Close navigation" hidden></button>
      <aside id="admin-navigation" class="sidebar" aria-label="Administration navigation">
        <button class="button mobile-navigation-close" type="button" data-action="navigation-close">Close menu</button>
        <a class="brand" href="#overview" aria-label="Server overview">
          <span class="brand-mark"><img class="application-logo" src="assets/logo-dark.svg" width="36" height="36" alt=""></span>
          <span id="brand-name">Sormus</span>
        </a>
        <div class="sidebar-body">
          <div class="nav-label">SERVER</div>
          <nav class="main-navigation">
            <button class="nav-item selected" data-view="overview" aria-label="Overview" aria-current="page"><i class="material-symbol ms-table-cells-large" aria-hidden="true"></i><span>Overview</span></button>
            <button class="nav-item" data-view="tasks" aria-label="Tasks"><i class="material-symbol ms-list-check" aria-hidden="true"></i><span>Tasks</span><span id="task-count" class="nav-count">0</span></button>
            <button class="nav-item" data-view="vistas" aria-label="Vistas"><i class="material-symbol ms-table-cells" aria-hidden="true"></i><span>Vistas</span></button>
            <button class="nav-item" data-view="universe" aria-label="Universe"><i class="material-symbol ms-meteor" aria-hidden="true"></i><span>Universe</span></button>
            <button class="nav-item" data-view="games" aria-label="Games"><i class="material-symbol ms-sports-esports" aria-hidden="true"></i><span>Games</span></button>
            <button class="nav-item" data-view="controls" aria-label="Controls"><i class="material-symbol ms-settings-remote" aria-hidden="true"></i><span>Controls</span></button>
            <button class="nav-item" data-view="devices" aria-label="Devices"><i class="material-symbol ms-router" aria-hidden="true"></i><span>Devices</span></button>
            <button class="nav-item" data-view="activity" aria-label="Activity"><i class="material-symbol ms-clock-rotate-left" aria-hidden="true"></i><span>Activity</span></button>
          </nav>
          <div class="nav-label settings-label">ADMINISTRATION</div>
          <nav><button class="nav-item" data-view="settings" aria-label="Settings"><i class="material-symbol ms-sliders" aria-hidden="true"></i><span>Settings</span></button><button class="nav-item" data-view="downloads" aria-label="Downloads"><i class="material-symbol ms-download" aria-hidden="true"></i><span>Downloads</span></button><button class="nav-item" data-view="variables" aria-label="Variables"><i class="material-symbol ms-data-object" aria-hidden="true"></i><span>Variables</span></button></nav>
          <div class="nav-label plugins-label">PLUGINS</div>
          <label class="plugin-navigation-search" for="plugin-search"><span class="visually-hidden">Find a plugin</span><input id="plugin-search" type="search" placeholder="Find a plugin" aria-label="Find a plugin"></label>
          <nav id="plugin-navigation" aria-label="Plugins"></nav>
        </div>
        <div class="sidebar-footer">
          <div class="sidebar-status"><span id="sidebar-status-dot" class="status-dot running"></span><span id="sidebar-status-text">Server running</span></div>
          <div class="sidebar-meta"><span>Windows</span><span id="server-version" aria-label="Server version">—</span></div>
        </div>
      </aside>

      <div class="main-shell">
        <header class="topbar">
          <button id="mobile-navigation-toggle" class="button mobile-navigation-toggle" type="button" data-action="navigation-toggle" aria-expanded="false" aria-controls="admin-navigation"><i class="material-symbol ms-bars" aria-hidden="true"></i>Menu</button>
          <div class="breadcrumbs"><span id="breadcrumb-name">Sormus</span><span class="breadcrumb-divider">/</span><span id="breadcrumb-page">Overview</span></div>
          <span class="mobile-server-version" data-server-version aria-label="Server version">—</span>
          <time id="server-clock" class="server-clock" aria-label="Server date and time"></time>
        </header>
        <!-- Views change in this workspace; editing opens the shared dialog below. -->
        <main id="workspace" tabindex="-1"></main>
        <footer class="workspace-footer"><span id="connection-status" role="status">Connecting</span><span id="save-status" data-save-status role="status" aria-live="polite">All changes saved</span></footer>
      </div>
    </div>

    <dialog id="editor-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <!-- A separate top-layer confirmation keeps the editor and draft in place. -->
    <dialog id="confirmation-dialog" class="confirmation-dialog" role="alertdialog"
      aria-labelledby="confirmation-title" aria-describedby="confirmation-description">
      <div class="dialog-header"><h2 id="confirmation-title">Discard unsaved changes?</h2></div>
      <div class="dialog-body"><p id="confirmation-description">Your changes have not been saved.</p></div>
      <div class="dialog-footer">
        <button class="button" type="button" data-action="keep-editing" autofocus>Keep editing</button>
        <button class="button danger" type="button" data-action="discard">Discard changes</button>
      </div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript><p class="noscript">Enable JavaScript to use this administration.</p></noscript>
  </body>
</html>
