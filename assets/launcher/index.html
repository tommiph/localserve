<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sormus Launcher</title><link rel="icon" href="/assets/controls/app-icon-192.png"><link rel="stylesheet" href="/assets/material-symbols/material-symbols.css"><link rel="stylesheet" href="launcher.css"><script src="model.js" defer></script><script src="navigation.js" defer></script><script src="launcher.js" defer></script></head>
<body data-theme="aurora"><div class="ambient-field"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div></div>
<main id="shell"><header><div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Sormus Launcher</span></div><nav id="navigation" aria-label="Launcher"><button data-tab="home" aria-current="page">Home</button><button data-tab="apps">Apps</button><button data-tab="inputs">Inputs</button><button data-tab="displays">Sormus</button><button data-tab="scenes">Lights</button><button data-tab="tasks">Tasks</button></nav><time id="clock"></time><button id="search-apps" class="icon-button search-button" aria-label="Search apps" hidden><i class="material-symbol ms-search" aria-hidden="true"></i></button><button id="personalize" class="icon-button" aria-label="Personalize launcher"><i class="material-symbol ms-tune" aria-hidden="true"></i></button></header>
<div id="content" tabindex="-1"><section class="hero"><div><p class="eyebrow" id="eyebrow">HOME</p><h1 id="title">Favorites</h1><p id="subtitle">Select an app, input or shortcut.</p></div></section><section id="favorites-section"><div class="section-heading"><h2 id="first-title">Quick access</h2><span id="app-filter" class="query-chip" hidden></span></div><div id="primary" class="tiles row" aria-label="Favorites"></div></section><section id="secondary-section"><div class="section-heading"><h2>Explore</h2></div><div id="secondary" class="tiles row" aria-label="Explore"></div></section></div>
</main><div id="status" class="toast" role="status" hidden></div>
<section id="drawer" class="overlay" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden><div class="drawer-panel"><p class="eyebrow">PERSONALIZATION</p><div class="section-heading"><h2 id="drawer-title">Your launcher</h2><button id="close-drawer" class="icon-button" aria-label="Close"><i class="material-symbol ms-close" aria-hidden="true"></i></button></div><h3>Atmosphere</h3><div class="theme-choices"><button data-theme="aurora" class="swatch aurora">Aurora</button><button data-theme="midnight" class="swatch midnight">Midnight</button><button data-theme="ember" class="swatch ember">Ember</button></div><button id="artwork" class="setting-row"></button><button id="tile-style" class="setting-row"></button><button id="motion" class="setting-row"></button><button id="manage" class="setting-row"><span>Edit favorites</span><i class="material-symbol ms-star" aria-hidden="true"></i></button><div id="favorite-order"></div><button id="manage-apps" class="setting-row"><span>Manage apps</span><i class="material-symbol ms-apps" aria-hidden="true"></i></button><button id="connection" class="setting-row"><span>Server connection</span><i class="material-symbol ms-wifi" aria-hidden="true"></i></button><button id="refresh" class="setting-row"><span>Refresh apps and inputs</span><i class="material-symbol ms-refresh" aria-hidden="true"></i></button><p class="drawer-note">Appearance and favorites are saved on this TV. Configure shared displays, scenes and Tasks in the Sormus administrator.</p><small id="version"></small></div></section>
<section id="search-panel" class="overlay search-panel" role="dialog" aria-modal="true" aria-labelledby="search-title" hidden><div class="search-dialog"><div class="section-heading"><h2 id="search-title">Find an app</h2><button id="close-search" class="icon-button" aria-label="Close search"><i class="material-symbol ms-close" aria-hidden="true"></i></button></div><output id="search-query" aria-live="polite"></output><div id="search-keys" class="search-keys"></div><div class="search-actions"><button id="search-space">Space</button><button id="search-delete">Delete</button><button id="search-clear">Clear</button><button id="search-done">Show results</button></div><p id="search-count"></p></div></section></body></html>
