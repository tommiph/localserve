<!doctype html>
<html lang="en" data-theme="dark" data-variant="unknown" data-connected="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platform · HSL Trains</title>
  <link rel="stylesheet" href="card.css">
</head>
<body data-ready-made>
  <main class="card" aria-label="Platform">
    <div class="art" aria-hidden="true"><img src="assets/motif.svg" alt=""></div>
    <header class="card-top"><span class="eyebrow">Station board</span><span class="source-status"><span data-card-text="source-status">Connecting</span></span></header>
    <section class="content" aria-label="Card readings" tabindex="0">
      <h1>
      <span data-card-text="source-name">No data</span>
      </h1>
      <p class="subline"><span data-card-text="station">No data</span></p>
      <section class="hero" aria-label="Next train">
        <span class="section-title">Next train</span>
        <div class="hero-value"><span data-card-text="next-train">No data</span></div>
        <h2><span data-card-text="next-route">No data</span></h2>
        <p class="subline">Track <span data-card-text="next-track">No data</span> · <span data-card-text="next-status">No data</span></p>
        <div class="departure-time">
          <span data-card-text="next-time">No data</span>
          <span class="badge"><span data-card-text="next-in">No data</span></span>
        </div>
      </section>
    </section>
    <footer class="card-bottom"><span>Received <span data-card-text="received">No data</span></span><span>Fintraffic / Digitraffic · CC BY 4.0 · Filtered by Sormus</span></footer>
  </main>
</body>
</html>
