<!doctype html>
<html lang="en" data-theme="dark" data-variant="unknown" data-connected="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital · Oculus Go</title>
  <link rel="stylesheet" href="card.css">
</head>
<body data-ready-made data-four-gauge>
  <main class="card" aria-label="Orbital">
    <div class="art" aria-hidden="true"><img src="assets/motif.svg" alt=""></div>
    <header class="card-top"><span class="eyebrow">Oculus Go</span><span class="source-status"><span data-card-text="source-status">Connecting</span></span></header>
    <section class="content" aria-label="Card readings" tabindex="0">
      <h1>
      <span data-card-text="app">No data</span>
      </h1>
      <p class="subline">
      <span data-card-text="state">No data</span> · <span data-card-text="charging">No data</span>
      </p>
      <div class="instruments">
      <div class="instrument">
      <div class="dial" data-card-meter="battery" role="meter" aria-label="Battery" aria-valuemin="0" aria-valuemax="100">
      <div>
      <span data-card-text="battery">No data</span>
      <small class="unit">%</small>
      </div>
      </div>
      <span>Battery</span>
      </div>
      <div class="instrument">
      <div class="dial" data-card-meter="storage" role="meter" aria-label="Storage used" aria-valuemin="0" aria-valuemax="100">
      <div>
      <span data-card-text="storage">No data</span>
      <small class="unit">%</small>
      </div>
      </div>
      <span>Storage used</span>
      </div>
      <div class="instrument">
      <div class="dial" data-card-meter="battery-temp" data-meter-mode="meter" data-meter-unit=" °C" role="img" aria-label="Battery temperature"  aria-valuemin="0" aria-valuemax="100">
      <div><span data-card-text="battery-temp">No data</span><small class="unit">°C</small></div>
      </div>
      <span>Battery temperature</span>
      </div>
      <div class="instrument">
      <div class="dial" data-card-meter="storage-free" role="meter" aria-label="Storage free" aria-valuemin="0" aria-valuemax="100">
      <div><span data-card-text="storage-free">No data</span><small class="unit">%</small></div>
      </div>
      <span>Storage free</span>
      </div>
      </div>
      <div class="metrics">
      <div class="metric">
      <span>Highest temperature</span>
      <strong>
      <span data-card-text="temperature">No data</span>
      <small class="unit"> °C</small>
      </strong>
      </div>
      <div class="metric">
      <span>Lowest emperature</span>
      <strong>
      <span data-card-text="temperature-min">No data</span>
      <small class="unit"> °C</small>
      </strong>
      </div>
      <div class="metric">
      <span>Free storage</span>
      <strong>
      <span data-card-text="free">No data</span>
      <small class="unit"> GiB</small>
      </strong>
      </div>
      <div class="metric">
      <span>Total storage</span>
      <strong>
      <span data-card-text="storage-total">No data</span>
      <small class="unit"> GiB</small>
      </strong>
      </div>
      </div>
    </section>
    <footer class="card-bottom"><span>Received <span data-card-text="received">No data</span></span><span>Oculus Go</span></footer>
  </main>
</body>
</html>
