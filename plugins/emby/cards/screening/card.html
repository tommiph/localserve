<!doctype html>
<html lang="en" data-theme="dark" data-connected="true">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screening room</title><link rel="stylesheet" href="card.css"></head>
<body data-ready-made>
  <main class="card" aria-label="Screening room">
    <div class="art" aria-hidden="true"><img src="assets/motif.svg" alt=""></div>
    <header><span class="eyebrow">Emby</span><span data-card-text="source-status">No data</span></header>
    <section class="content" tabindex="0" aria-label="Screening room">
      <p class="label">Now playing</p><h1 data-card-text="title">No data</h1>
      <p class="subtitle" data-card-text="series">No data</p>
      <div class="feature"><span data-card-text="playback">No data</span><span class="progress"><span data-card-text="progress">No data</span><span class="unit">%</span></span></div>
      <p class="device" data-card-text="device">No data</p>
      <div class="list-wrap"><table data-card-table="sessions" aria-label="Screening room"><tbody><tr><td>No data</td></tr></tbody></table></div>
      <p class="status" data-card-text="status">No data</p>
    </section>
    <footer>Received <span data-card-text="received">No data</span></footer>
  </main>
</body></html>
