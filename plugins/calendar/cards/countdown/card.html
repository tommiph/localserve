<!doctype html>
<html lang="en" data-theme="dark" data-connected="true">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown</title><link rel="stylesheet" href="card.css"></head>
<body data-ready-made><main class="card" aria-label="Date countdown">
  <header><span class="eyebrow">Calendar · Countdown</span><span data-card-text="source-status">No data</span></header>
  <section class="content" tabindex="0" aria-label="Countdown">
    <h1 data-card-text="name">No data</h1>
    <p class="label">Time remaining · days / hours : minutes : seconds</p>
    <p class="remaining" data-card-text="remaining">No data</p>
    <p class="target">Target <span data-card-text="target">No data</span></p>
    <p class="status">Last reading: <span data-card-text="status">No data</span></p>
  </section>
  <footer>Checked <span data-card-text="checked">No data</span></footer>
</main></body></html>
