<!doctype html>
<html lang="en" data-theme="dark" data-variant="unknown" data-connected="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Front page · News</title>
  <link rel="stylesheet" href="card.css">
</head>
<body data-ready-made>
  <main class="card" aria-label="Front page">
    <div class="art" aria-hidden="true"><img src="assets/motif.svg" alt=""></div>
    <header class="card-top"><span class="eyebrow">News</span><span class="source-status"><span data-card-text="source-status">Connecting</span></span></header>
    <section class="content" aria-label="Card readings" tabindex="0">
      <div class="masthead">
      <h1>
      <span data-card-text="source-name">No data</span>
      </h1>
      <p class="subline">
      <span data-card-text="feed">No data</span>
      </p>
      </div>
      <article class="story">
      <span class="story-number">01</span>
      <div>
      <h2>
      <span data-card-text="title-1">No data</span>
      </h2>
      <p class="byline">
      <span data-card-text="publisher-1">No data</span> · <span data-card-text="date-1">No data</span>
      </p>
      </div>
      </article>
      <article class="story">
      <span class="story-number">02</span>
      <div>
      <h2>
      <span data-card-text="title-2">No data</span>
      </h2>
      <p class="byline">
      <span data-card-text="publisher-2">No data</span> · <span data-card-text="date-2">No data</span>
      </p>
      </div>
      </article>
<article class="story">
      <span class="story-number">03</span>
      <div>
      <h2>
      <span data-card-text="title-3">No data</span>
      </h2>
      <p class="byline">
      <span data-card-text="publisher-3">No data</span> · <span data-card-text="date-3">No data</span>
      </p>
      </div>
      </article>
<article class="story">
      <span class="story-number">04</span>
      <div>
      <h2>
      <span data-card-text="title-4">No data</span>
      </h2>
      <p class="byline">
      <span data-card-text="publisher-4">No data</span> · <span data-card-text="date-4">No data</span>
      </p>
      </div>
      </article>
    </section>
    <footer class="card-bottom"><span>Received <span data-card-text="received">No data</span></span><span>Google News RSS</span></footer>
  </main>
</body>
</html>
