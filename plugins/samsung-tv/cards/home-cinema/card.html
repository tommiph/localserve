<!doctype html>
<html lang="en" data-theme="dark" data-variant="unknown" data-connected="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home cinema · Samsung TV</title>
  <link rel="stylesheet" href="card.css">
</head>
<body data-ready-made>
  <main class="card" aria-label="Home cinema">
    <div class="art" aria-hidden="true"><img src="assets/motif.svg" alt=""></div>
    <header class="card-top"><span class="eyebrow">Samsung TV</span><span class="source-status"><span data-card-text="source-status">Connecting</span></span></header>
    <section class="content" aria-label="Card readings" tabindex="0">
      <h1>
      <span data-card-text="name">No data</span>
      </h1>
      <p class="subline">
      <span data-card-text="model">No data</span> · <span data-card-text="resolution">No data</span>
      </p>
      <section class="hero">
      <span class="section-title">Reported power</span>
      <h2 class="power">
      <span data-card-text="power">No data</span>
      </h2>
      <p class="subline">
      <span data-card-text="connection">No data</span>
      </p>
      </section>
      <div class="cinema-status">
      <div class="instrument">
      <div class="dial" data-card-meter="volume" role="meter" aria-label="Volume" aria-valuemin="0" aria-valuemax="100">
      <div>
      <span data-card-text="volume">No data</span>
      <small class="unit">%</small>
      </div>
      </div>
      <span>Volume</span>
      </div>
      <div>
      <span class="section-title">Playback</span>
      <h2>
      <span data-card-text="playback">No data</span>
      </h2>
      <p class="subline">
      <span data-card-text="position">No data</span> / <span data-card-text="duration">No data</span>
      </p>
      <p class="subline">Muted <span data-card-text="muted">No data</span>
      </p>
      </div>
      </div>
      <p class="subline">Read sections <span data-card-text="details">No data</span>
      </p>
    </section>
    <footer class="card-bottom"><span>Received <span data-card-text="received">No data</span></span><span>Samsung TV</span></footer>
  </main>
</body>
</html>
