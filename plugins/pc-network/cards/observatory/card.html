<!doctype html>
<html lang="en" data-theme="dark" data-variant="unknown" data-connected="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Observatory · PC and Network</title>
  <link rel="stylesheet" href="card.css">
</head>
<body data-ready-made data-four-gauge>
  <main class="card" aria-label="Observatory">
    <div class="art" aria-hidden="true"><img src="assets/motif.svg" alt=""></div>
    <header class="card-top"><span class="eyebrow">PC and Network</span><span class="source-status"><span data-card-text="source-status">Connecting</span></span></header>
    <section class="content" aria-label="Card readings" tabindex="0">
      <h1>
      <span data-card-text="host">No data</span>
      </h1>
      <p class="subline">
      <span data-card-text="cpu-model">No data</span>
      </p>
      <div class="instruments">
      <div class="instrument">
      <div class="dial" data-card-meter="cpu" role="meter" aria-label="CPU usage" aria-valuemin="0" aria-valuemax="100">
      <div>
      <span data-card-text="cpu">No data</span>
      <small class="unit">%</small>
      </div>
      </div>
      <span>CPU usage</span>
      </div>
      <div class="instrument">
      <div class="dial" data-card-meter="memory" role="meter" aria-label="Memory usage" aria-valuemin="0" aria-valuemax="100">
      <div>
      <span data-card-text="memory">No data</span>
      <small class="unit">%</small>
      </div>
      </div>
      <span>Memory usage</span>
      </div>
      <div class="instrument">
      <div class="dial" data-card-meter="gpu" role="meter" aria-label="GPU usage" aria-valuemin="0" aria-valuemax="100">
      <div>
      <span data-card-text="gpu">No data</span>
      <small class="unit">%</small>
      </div>
      </div>
      <span>GPU usage</span>
      </div>
      <div class="instrument">
      <div class="dial" data-card-meter="gpu-memory" role="meter" aria-label="Dedicated memory usage" aria-valuemin="0" aria-valuemax="100">
      <div>
      <span data-card-text="gpu-memory">No data</span>
      <small class="unit">%</small>
      </div>
      </div>
      <span>Dedicated memory usage</span>
      </div>
      </div>
      <div class="metrics">
      <div class="metric">
      <span>Memory used</span>
      <strong>
      <span data-card-text="used">No data</span>
      <small class="unit"> GiB</small>
      </strong>
      </div>
      <div class="metric">
      <span>Receive</span>
      <strong>
      <span data-card-text="receive">No data</span>
      <small class="unit"> Mb/s</small>
      </strong>
      </div>
      <div class="metric">
      <span>Send</span>
      <strong>
      <span data-card-text="send">No data</span>
      <small class="unit"> Mb/s</small>
      </strong>
      </div>
      <div class="metric">
      <span>Uptime</span>
      <strong>
      <span data-card-text="uptime">No data</span>
      <small class="unit"> h</small>
      </strong>
      </div>
      </div>
    </section>
    <footer class="card-bottom"><span>Received <span data-card-text="received">No data</span></span><span>PC and Network</span></footer>
  </main>
</body>
</html>
