<!doctype html>
<html lang="en" data-theme="dark" data-connected="true" data-variant="unknown">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Departure lounge · Fullscreen</title><link rel="stylesheet" href="fullscreen.css"></head>
<body data-ready-made><main class="fs-card" aria-label="Departure lounge · Fullscreen">
<div class="fs-art" aria-hidden="true"><img src="assets/motif.svg" alt=""></div>
<header class="fs-header"><span class="fs-eyebrow">Finavia</span><span class="fs-status" data-card-text="source-status">Unavailable</span></header>
<div class="fs-workspace"><section class="fs-summary" tabindex="0" aria-label="Summary">
<h1 class="fs-title"><span data-card-text="airport" >No data</span></h1><p class="fs-subtitle"><span data-card-text="route-filter" >No data</span></p>
<div class="fs-hero"><span data-card-text="flight-count" >No data</span> <small>flights</small></div>


<div class="fs-metrics"><div class="fs-metric"><div class="fs-metric-inner"><span class="fs-label">Displayed flight count</span><strong><span data-card-text="flight-count" >No data</span></strong></div></div>
<div class="fs-metric"><div class="fs-metric-inner"><span class="fs-label">Route airport filter</span><strong><span data-card-text="route-filter" >No data</span></strong></div></div>
<div class="fs-metric"><div class="fs-metric-inner"><span class="fs-label">Flight number filter</span><strong><span data-card-text="flight-filter" >No data</span></strong></div></div></div>
</section><section class="fs-details" tabindex="0" aria-label="Detailed readings">
<div class="fs-tables fs-tables-one"><section class="fs-table-panel"><h2 class="fs-section-title">Flights · up to 10</h2><div class="fs-table-wrap"><table data-card-table="board" aria-label="Flights"><tbody><tr><td>No data</td></tr></tbody></table></div></section></div>
<p class="fs-note">Up to 10 matching flights. Scheduled and reported times can differ.</p>
</section></div><footer class="fs-footer"><span>Last reading <span data-card-text="received" >No data</span></span><span>Departure lounge</span></footer>
</main></body></html>
