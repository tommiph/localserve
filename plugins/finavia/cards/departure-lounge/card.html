<!doctype html>
<html lang="en" data-theme="dark" data-variant="unknown" data-connected="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Departure lounge · Finavia</title>
  <link rel="stylesheet" href="card.css">
</head>
<body data-ready-made>
  <main class="card" aria-label="Departure lounge">
    <div class="art" aria-hidden="true"><img src="assets/motif.svg" alt=""></div>
    <header class="card-top"><span class="eyebrow">Airport board</span><span class="source-status"><span data-card-text="source-status">Connecting</span></span></header>
    <section class="content" aria-label="Card readings" tabindex="0">
      <h1>
      <span data-card-text="source-name">No data</span>
      </h1>
      <p class="subline">
      <span data-card-text="airport">No data</span>
      </p>
      <section class="hero">
      <span class="section-title">Next flight</span>
      <div class="hero-value">
      <span data-card-cell="board:0:flight">No data</span>
      </div>
      <h2>
      <span data-card-cell="board:0:route">No data</span>
      </h2>
      <p class="subline">Gate <span data-card-cell="board:0:gate">No data</span> · <span data-card-cell="board:0:status">No data</span>
      </p>
      <div class="flight-time">
      <span data-card-cell="board:0:time">No data</span> <span class="badge">
      <span data-card-cell="board:0:in-minutes">No data</span>
      </span>
      </div>
      </section>
    </section>
    <footer class="card-bottom"><span>Received <span data-card-text="received">No data</span></span><span>Finavia Public Flights · Filtered by Localserve</span></footer>
  </main>
</body>
</html>
