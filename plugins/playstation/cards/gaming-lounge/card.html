<!doctype html>
<html lang="en" data-theme="dark" data-variant="unknown" data-connected="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaming lounge · PlayStation</title>
  <link rel="stylesheet" href="card.css">
</head>
<body data-ready-made data-four-gauge>
  <main class="card" aria-label="Gaming lounge">
    <div class="art" aria-hidden="true"><img src="assets/motif.svg" alt=""></div>
    <header class="card-top"><span class="eyebrow">PlayStation</span><span class="source-status"><span data-card-text="source-status">Connecting</span></span></header>
    <section class="content" aria-label="Card readings" tabindex="0">
      <h1>
      <span data-card-text="game">No data</span>
      </h1>
      <p class="subline presence-line">
        <span class="presence-status"><span class="presence-dot"></span><span data-card-text="presence">No data</span></span>
        <span class="separator">·</span><span class="account-name" data-card-text="account">No data</span>
        <span class="separator">·</span><span class="game-playtime">Playtime <span data-card-text="hours">No data</span><span class="hours-unit"> h</span></span>
      </p>
      <div class="instruments">
      <div class="instrument">
      <div class="dial" data-card-meter="level" data-meter-mode="value" role="img" aria-label="Trophy level">
      <div><span data-card-text="level">No data</span></div>
      </div>
      <span>Trophy level</span>
      </div>
      <div class="instrument">
      <div class="dial" data-card-meter="progress" role="meter" aria-label="Level progress" aria-valuemin="0" aria-valuemax="100">
      <div>
      <span data-card-text="progress">No data</span>
      <small class="unit">%</small>
      </div>
      </div>
      <span>Level progress</span>
      </div>
      <div class="instrument">
      <div class="dial" data-card-meter="trophies-total" data-meter-mode="value" role="img" aria-label="Total trophies"  aria-valuemin="0" aria-valuemax="100">
      <div><span data-card-text="trophies-total">No data</span></div>
      </div>
      <span>Total trophies</span>
      </div>
      <div class="instrument">
      <div class="dial" data-card-meter="all-hours" data-meter-mode="value" data-meter-unit=" hours" role="img" aria-label="All games playtime">
      <div><span data-card-text="all-hours">No data</span><small class="unit">h</small></div>
      </div>
      <span>Total playtime</span>
      </div>
      </div>
      <div class="metrics">
      <div class="metric platinum"><span>Platinum</span><div class="trophy-value"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v7a4 4 0 0 1-8 0V3ZM8 5H5v3a3 3 0 0 0 3 3m8-6h3v3a3 3 0 0 1-3 3m-4 3v4m-4 3h8m-7-3h6v3H9z"/></svg><strong data-card-text="platinum">No data</strong></div></div>
      <div class="metric gold"><span>Gold</span><div class="trophy-value"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v7a4 4 0 0 1-8 0V3ZM8 5H5v3a3 3 0 0 0 3 3m8-6h3v3a3 3 0 0 1-3 3m-4 3v4m-4 3h8m-7-3h6v3H9z"/></svg><strong data-card-text="gold">No data</strong></div></div>
      <div class="metric silver"><span>Silver</span><div class="trophy-value"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v7a4 4 0 0 1-8 0V3ZM8 5H5v3a3 3 0 0 0 3 3m8-6h3v3a3 3 0 0 1-3 3m-4 3v4m-4 3h8m-7-3h6v3H9z"/></svg><strong data-card-text="silver">No data</strong></div></div>
      <div class="metric bronze"><span>Bronze</span><div class="trophy-value"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v7a4 4 0 0 1-8 0V3ZM8 5H5v3a3 3 0 0 0 3 3m8-6h3v3a3 3 0 0 1-3 3m-4 3v4m-4 3h8m-7-3h6v3H9z"/></svg><strong data-card-text="bronze">No data</strong></div></div>
      </div>
    </section>
    <footer class="card-bottom"><span>Received <span data-card-text="received">No data</span></span><span>PlayStation</span></footer>
  </main>
</body>
</html>
