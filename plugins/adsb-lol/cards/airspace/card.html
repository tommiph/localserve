<!doctype html>
<html lang="en" data-theme="dark" data-connected="true">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airspace · adsb.lol</title><link rel="stylesheet" href="card.css"></head>
<body data-ready-made>
  <main class="card" aria-label="Airspace">
    <div class="art" aria-hidden="true"><img src="assets/motif.svg" alt=""></div>
    <header class="card-top"><span class="eyebrow">Airspace</span><span class="source-status" data-card-text="source-status">No data</span></header>
    <section class="content" tabindex="0" aria-label="Nearby aircraft readings">
      <h1 data-card-text="source-name">No data</h1>
      <p class="subline">Recent positions · <span data-card-text="count">No data</span></p>
      <!-- The first distance-sorted public row is the nearest reported aircraft.
           No route, destination or departure is inferred. -->
      <section class="hero">
        <span class="section-title">Nearest aircraft</span>
        <div class="hero-value"><span data-card-text="nearest">No data</span></div>
        <h2 data-card-cell="traffic:0:type">No data</h2>
        <p class="subline">Altitude (ft) · <span data-card-cell="traffic:0:altitude-label">No data</span><br>Speed (kt) · <span data-card-cell="traffic:0:speed">No data</span></p>
        <div class="flight-time"><span class="badge"><span data-card-text="distance">No data</span><span class="distance-unit"> NM</span></span><span class="distance-label">Calculated distance</span></div>
      </section>
      <p class="read-status" data-card-text="status">No data</p>
    </section>
    <footer class="card-bottom"><span>Received <span data-card-text="received">No data</span></span><span>Data adsb.lol · ODbL 1.0 · Not for navigation</span></footer>
  </main>
</body></html>
