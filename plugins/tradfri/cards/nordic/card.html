<!doctype html>
<html lang="en" data-theme="dark" data-variant="unknown" data-connected="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nordic · TRÅDFRI</title>
  <link rel="stylesheet" href="card.css">
</head>
<body data-ready-made data-four-gauge>
  <main class="card" aria-label="Nordic">
    <div class="art" aria-hidden="true"><img src="assets/motif.svg" alt=""></div>
    <header class="card-top"><span class="eyebrow">TRÅDFRI</span><span class="source-status"><span data-card-text="source-status">Connecting</span></span></header>
    <section class="content" aria-label="Card readings" tabindex="0">
      <h1>
      <span data-card-text="clock">No data</span>
      </h1>
      <p class="subline">
      Sunrise <span data-card-text="sunrise">No data</span> · Sunset <span data-card-text="sunset">No data</span>
      </p>
      <div class="instruments">
      <div class="instrument"><div class="dial" data-card-meter="bulb-1-brightness" role="meter" aria-label="Bulb 1 brightness" aria-valuemin="0" aria-valuemax="100"><div><span data-card-text="bulb-1-brightness">No data</span><small class="unit">%</small></div></div><span>Bulb 1</span></div>
      <div class="instrument"><div class="dial" data-card-meter="bulb-2-brightness" role="meter" aria-label="Bulb 2 brightness" aria-valuemin="0" aria-valuemax="100"><div><span data-card-text="bulb-2-brightness">No data</span><small class="unit">%</small></div></div><span>Bulb 2</span></div>
      <div class="instrument"><div class="dial" data-card-meter="bulb-3-brightness" role="meter" aria-label="Bulb 3 brightness" aria-valuemin="0" aria-valuemax="100"><div><span data-card-text="bulb-3-brightness">No data</span><small class="unit">%</small></div></div><span>Bulb 3</span></div>
      <div class="instrument"><div class="dial" data-card-meter="bulb-4-brightness" role="meter" aria-label="Bulb 4 brightness" aria-valuemin="0" aria-valuemax="100"><div><span data-card-text="bulb-4-brightness">No data</span><small class="unit">%</small></div></div><span>Bulb 4</span></div>
      </div>
      <div class="metrics">
      <div class="metric"><span>Bulb 1 color</span><div class="color-value"><i class="color-swatch" data-card-color="bulb-1-color" hidden aria-hidden="true"></i><strong data-card-text="bulb-1-color">No data</strong></div></div>
      <div class="metric"><span>Bulb 2 color</span><div class="color-value"><strong data-card-text="bulb-2-color">No data</strong></div></div>
      <div class="metric"><span>Bulb 3 color</span><div class="color-value"><strong data-card-text="bulb-3-color">No data</strong></div></div>
      <div class="metric"><span>Bulb 4 color</span><div class="color-value"><strong data-card-text="bulb-4-color">No data</strong></div></div>
      </div>
    </section>
    <footer class="card-bottom"><span>Received <span data-card-text="received">No data</span></span><span>TRÅDFRI</span></footer>
  </main>
</body>
</html>
