<!doctype html>
<html lang="en" data-theme="dark" data-variant="unknown" data-connected="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal lab · Simulator</title>
  <link rel="stylesheet" href="card.css">
</head>
<body data-ready-made>
  <main class="card" aria-label="Signal lab">
    <div class="art" aria-hidden="true"><img src="assets/motif.svg" alt=""></div>
    <header class="card-top"><span class="eyebrow">Simulator</span><span class="source-status"><span data-card-text="source-status">Connecting</span></span></header>
    <section class="content" aria-label="Card readings" tabindex="0">
      <h1>
      <span data-card-text="source-name">No data</span>
      </h1>
      <section class="hero">
      <span class="section-title">Current value</span>
      <div class="hero-value signal-value" data-card-flash="value">
      <span data-card-text="value">No data</span>
      </div>
      <p class="subline">Previous <span data-card-text="previous">No data</span>
      </p>
      </section>
      <div class="metrics">
      <div class="metric" data-card-flash="pulses">
      <span>Pulses</span>
      <strong>
      <span data-card-text="pulses">No data</span>
      </strong>
      </div>
      <div class="metric">
      <span>Last pulse</span>
      <strong>
      <span data-card-text="pulse-time">No data</span>
      </strong>
      </div>
      </div>
      <div class="signal-message" data-card-flash="signal">
      <span class="section-title">Latest signal</span>
      <h2>
      <span data-card-text="signal">No data</span>
      </h2>
      <p class="subline">
      <span data-card-text="signal-time">No data</span>
      </p>
      </div>
    </section>
    <footer class="card-bottom"><span>Value changed <span data-card-text="received">No data</span></span><span>Simulator</span></footer>
  </main>
</body>
</html>
