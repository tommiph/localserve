<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920"><title>PlayStation · Sormus</title><link rel="stylesheet" href="launch.css"><script src="url-target.js" defer></script><script src="hdmi.js" defer></script><script src="launch.js" defer></script></head>
<body><main id="launcher"><img class="logo" src="wordmark.png" alt="PS5"><h1>PlayStation mode</h1><p id="status" role="status">Connecting to Sormus…</p>
<form id="connection" hidden><div class="fields"><label>Protocol<select id="protocol"><option value="http:">HTTP</option><option value="https:">HTTPS</option></select></label><label class="host">Server IP or hostname<input id="host" readonly type="text" maxlength="253" autocomplete="off" spellcheck="false"></label><label>Port<input id="port" readonly type="number" min="1" max="65535" inputmode="numeric"></label></div>
<label class="layout-field">Display mode<select id="layout"><option value="split">Split view · HDMI 1 at 50%</option><option value="hud">Full-screen HDMI · game HUD</option></select></label>
<div class="appearance-fields"><label>HUD layout<select id="hud-style"><option value="edges">Edges</option><option value="top">Top</option><option value="right">Right</option><option value="bottom">Bottom</option><option value="left">Left</option><option value="ticker">Single-line scroller</option><option value="none">No HUD</option></select></label><label>HUD opacity <output id="opacity-value">100%</output><input id="hud-opacity" type="range" min="0" max="100" step="5" value="100"></label></div><p class="hint">CH+ Settings · CH− HUD layout · Info Split / HUD · Play/Pause Motion · Back Exit</p>
<div class="buttons"><button id="save" type="submit">Save and connect</button><button id="resume" type="button">Return to game</button><button id="exit" type="button">Exit</button></div><p class="hint">Settings are saved on this TV. Press OK to edit an address field. Up/Down moves between controls; Left/Right changes a selection. Return to game keeps the current screen.</p></form></main></body></html>
